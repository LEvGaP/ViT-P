train:
  batch_size_per_gpu: 20
  dataset_path: ADE20k
  OFFICIAL_EPOCH_LENGTH: 320
  saveckp_freq: 100
  save_last: true
  output_dir: "./OUTPUT_DIR"
  num_workers: 6
  seed: 42

MODEL:
  WEIGHTS: ""

student:
  arch: vit_base
  patch_size: 14
  num_points: 250
  num_classes: 150
  pretrained_weights: '/home/s0038/_scratch2/ViT-P/ViT-P/dinov2/weights/dinov2_vitb14_pretrain.pth'

teacher:
  momentum_teacher: 0.994
  final_momentum_teacher: 1.0
  teacher_temp: 0.04
  warmup_teacher_temp: 0.04
  warmup_teacher_temp_epochs: 0

evaluation:
  eval_period_iterations: 400 

optim:
  epochs: 60
  lr: 9e-3
  weight_decay: 0.05
  weight_decay_end: 0.05
  clip_grad: 1.0
  warmup_epochs: 0
  min_lr: 1e-6
  freeze_last_layer_epochs: 0
  adamw_beta1: 0.9
  adamw_beta2: 0.999

crops:
  global_crops_size: [518, 518]

logging:
  log_freq: 10
  tensorboard: true
  tensorboard_dir: ${train.output_dir}/tb